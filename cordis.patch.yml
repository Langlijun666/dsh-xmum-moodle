# Bundle patch layer: one row loads the package's main entry as the Host half
# (a plain Cordis plugin); the `dsh.client` declaration in package.json makes the
# Web app load ./client.js as the browser half.
- insert:
    - id: dsh-xmum-moodle
      name: 'dsh-xmum-moodle'
      config:
        siteUrl: 'https://l.xmu.edu.my'
